<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="text-scale" content="scale">
<title>Option A · Tactile Woodblock &amp; Brass — Brainy Bits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#09130d;--card:#14281d;--card2:#1a3325;--brass:#f2c15a;--amber:#ff9234;
    --ink:#f7faf8;--sub:#b8d1c2;--muted:#93b39f;--rule:rgba(242,193,90,.24);
    --ease:cubic-bezier(0.22,1,0.36,1);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:radial-gradient(110% 70% at 50% 0%,#1a3827 0%,var(--bg) 72%);
    font-family:"Baloo 2",ui-rounded,system-ui,-apple-system,sans-serif;color:var(--ink);line-height:1.45;padding:18px 16px 32px}
  .shell{max-width:960px;margin:0 auto;display:grid;gap:20px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px}
  .tag{font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--brass);text-transform:uppercase}
  .bar p{margin:2px 0 0;color:var(--sub);font-size:.9rem}
  .panes{display:grid;gap:18px;grid-template-columns:1fr}
  @media(min-width:760px){.panes{grid-template-columns:1.15fr .85fr;align-items:start}}
  .panel{background:linear-gradient(175deg,#183022,#102017);border:1px solid rgba(242,193,90,.22);border-radius:26px;padding:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
  .hubhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px;margin:0;font-size:1.7rem;font-weight:800;line-height:1.15;color:var(--brass)}
  .iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid rgba(242,193,90,.28);background:rgba(255,255,255,.07);color:#f3f7f4;display:grid;place-items:center;cursor:pointer}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08)}
  .stat b{display:block;font-size:1.35rem;line-height:1.1;color:var(--brass);font-variant-numeric:tabular-nums}
  .stat small{display:block;font-size:.82rem;color:var(--sub)}
  .daily{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 16px;
    border-radius:18px;border:1.5px solid rgba(242,193,90,.45);background:linear-gradient(145deg,#3b2d12,#221a0a);color:#fff;margin-bottom:14px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,235,179,.16)}
  .daily small{display:block;font-size:.82rem;font-weight:700;color:var(--brass)}
  .daily b{font-size:1.1rem}
  .go{padding:9px 16px;border-radius:12px;background:linear-gradient(180deg,#ffd15c,#ff8b33);color:#261200;font-weight:800;font-size:.98rem;box-shadow:0 3px 0 #a34310}
  .cards{display:grid;gap:10px}
  .gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 14px;border-radius:18px;
    border:1px solid rgba(255,255,255,.12);background:linear-gradient(160deg,#1d3829,#12241a);color:#fff;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .14s var(--ease),border-color .14s var(--ease)}
  .gcard.koi{background:linear-gradient(160deg,#154545,#0c282a)}
  .gcard.mem{background:linear-gradient(160deg,#2a234d,#181330)}
  .gcard.rain{background:linear-gradient(160deg,#163858,#0d2136)}
  .gcard.word{background:linear-gradient(160deg,#472e1f,#261810)}
  .badge{width:52px;height:52px;flex:none;border-radius:15px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
  .gt{flex:1;min-width:0}
  .gt b{display:block;font-size:1.12rem;line-height:1.2}
  .gt small{display:block;color:var(--sub);font-size:.86rem}
  .meter{margin-top:6px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .meter i{display:block;height:100%;border-radius:99px;background:var(--brass)}
  /* Preview card 2: Result screen with engraved brass medal */
  .res{text-align:center;display:grid;gap:10px}
  .medal{width:76px;height:76px;margin:2px auto;border-radius:22px;background:radial-gradient(circle at 35% 25%,#463819,#241c0c);
    border:1.5px solid rgba(242,193,90,.55);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .res h2{margin:0;font-size:1.55rem}
  .hero{font-size:3rem;font-weight:800;line-height:1;color:var(--brass);font-variant-numeric:tabular-nums}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rcell{padding:10px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08)}
  .rcell b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
  .rcell small{color:var(--sub);font-size:.82rem}
  .cta{width:100%;min-height:48px;border:0;border-radius:15px;font-family:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;
    background:linear-gradient(180deg,#ffd15c,#ff8b33);color:#261200;box-shadow:0 5px 0 #a34310,inset 0 1px 0 rgba(255,255,255,.4)}
  .sec{width:100%;min-height:46px;border:1px solid rgba(255,255,255,.18);border-radius:15px;background:rgba(255,255,255,.08);
    color:#fff;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
  :focus-visible{outline:3px solid #fff7e6;outline-offset:3px}
  @media(hover:hover) and (pointer:fine){.gcard:hover{transform:translateY(-2px);border-color:rgba(242,193,90,.45)}}
  @media(prefers-reduced-motion:reduce){.gcard{transition:none}.gcard:hover{transform:none}}
</style>
</head>
<body>
<main class="shell">
  <div class="bar">
    <div>
      <span class="tag">Option A · Tactile Woodblock &amp; Brass</span>
      <p>Giữ trọn bảng màu 5 game buổi tối, thêm chất liệu bàn cờ khắc đồng ấm và icon SVG đồng nhất.</p>
    </div>
  </div>
  <section class="panes" aria-label="Bản xem thử Option A">
    <div class="panel">
      <div class="hubhead">
        <h1 class="brand">
          <svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="4" width="18" height="18" rx="5" fill="#ffd54a"/><rect x="26" y="4" width="18" height="18" rx="5" fill="#ff8a3d"/><rect x="4" y="26" width="18" height="18" rx="5" fill="#7ee081"/><rect x="27.5" y="27.5" width="15" height="15" rx="4" fill="none" stroke="#ffd54a" stroke-opacity=".6" stroke-width="3"/><circle cx="35" cy="35" r="3" fill="#ffd54a"/></svg>
          Brainy Bits
        </h1>
        <button type="button" class="iconbtn" aria-label="Cài đặt">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="6" width="16" height="2.2" rx="1.1"/><circle cx="9" cy="7.1" r="2.6"/><rect x="4" y="15.8" width="16" height="2.2" rx="1.1"/><circle cx="15" cy="16.9" r="2.6"/></svg>
        </button>
      </div>
      <div class="stats">
        <div class="stat">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 2.5c.4 3.4-2.1 5-2.1 7.6 0 1.4 1.1 2.4 2.3 2.4 1.7 0 2.7-1.6 2.3-4.1 2.5 1.8 4 4.5 4 7.3a7 7 0 1 1-14 0c0-3.4 2-6.6 5.1-8.9-.2 1.8.8 3.2 2.2 3.2-.5-2-.4-5 .2-7.5z" fill="#ff8a3d"/></svg>
          <div><b>5</b><small>ngày liên tiếp</small></div>
        </div>
        <div class="stat">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 16.7l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="#ffd54a"/></svg>
          <div><b>48</b><small>sao đã có</small></div>
        </div>
      </div>
      <button type="button" class="daily">
        <span><small>Thử thách hôm nay #14</small><b>Đường Ray · Level 4</b></span>
        <span class="go">Chơi</span>
      </button>
      <div class="cards">
        <button type="button" class="gcard">
          <span class="badge" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 48 48"><path d="M6 40h36" stroke="#a9c2b2" stroke-width="3" stroke-linecap="round"/><rect x="11" y="8" width="26" height="26" rx="8" fill="#ffb02e"/><rect x="16" y="13" width="16" height="9" rx="3" fill="#2a1300"/><circle cx="18" cy="28" r="2.4" fill="#2a1300"/><circle cx="30" cy="28" r="2.4" fill="#2a1300"/></svg></span>
          <span class="gt"><b>Đường Ray Tư Duy</b><small>Đã qua 5/11 level · 14/33 sao</small><span class="meter"><i style="width:45%"></i></span></span>
        </button>
        <button type="button" class="gcard koi">
          <span class="badge" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 48 48"><path d="M7 24c6-10 20-12 28-4l7-6v20l-7-6c-8 8-22 6-28-4z" fill="#ffb38a"/><circle cx="12.5" cy="22.5" r="1.8" fill="#0d2c2e"/></svg></span>
          <span class="gt"><b>Cho Cá Koi Ăn</b><small>Đã qua 4/10 level · 11/30 sao</small><span class="meter"><i style="width:40%;background:#7fe3d0"></i></span></span>
        </button>
        <button type="button" class="gcard mem">
          <span class="badge" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 48 48"><rect x="6" y="6" width="16" height="16" rx="4" fill="#ffd54a"/><rect x="26" y="6" width="16" height="16" rx="4" fill="#463d7a"/><rect x="6" y="26" width="16" height="16" rx="4" fill="#463d7a"/><rect x="26" y="26" width="16" height="16" rx="4" fill="#ffd54a"/></svg></span>
          <span class="gt"><b>Ô Sáng Ghi Nhớ</b><small>Đã qua 7/13 level · 20/39 sao</small><span class="meter"><i style="width:54%;background:#c6b6ff"></i></span></span>
        </button>
      </div>
    </div>

    <div class="panel res">
      <div class="medal" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 24 24"><path d="M12 2.5l2.8 5.6 6.2.9-4.5 4.4 1.1 6.2L12 16.7l-5.6 2.9 1.1-6.2L3 9l6.2-.9z" fill="#ffd54a"/></svg>
      </div>
      <h2>Qua Level 4!</h2>
      <div class="hero">92%</div>
      <div class="rgrid">
        <div class="rcell"><b>11/12</b><small>tàu về đúng ga</small></div>
        <div class="rcell"><b>7</b><small>chuỗi đúng dài nhất</small></div>
      </div>
      <p style="margin:2px 0;color:var(--sub);font-size:.9rem">Level 5 mở thêm 1 nhà ga mới.</p>
      <button type="button" class="cta">Level 5</button>
      <button type="button" class="sec">Về menu</button>
    </div>
  </section>
</main>
</body>
</html>
