name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browsers for ubuntu 26.04 (ubuntu-latest since 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parity with the artifact export
        run: npm run parity
      - name: Difficulty engine tests
        run: npm run test:sim
      # Calibration gates (seeded, full N = 1200 per MERGED-SPEC §6; koi 2000). E3 lifted 2026-11-21:
      # every gate runs on every level. No game passes all gates at full N yet, so each stays report-only
      # (one step per game, so the run page shows which one is red). The exact failing set per game is
      # pinned by the KNOWN-FAIL tests in `npm run test:sim`, which DO block: a new miss or a fixed one
      # breaks them. Drop continue-on-error on a game the day its calibrate exits 0.
      # Shared miss (train, koi, mem): G1 L5. p*(5) = 0.797 puts median <= 0.847 (gate B), so weak >= 0.85
      # cannot hold too. Waiting on Duy: drop the L5 peak dip, scope G1 to L1-4, or start the sawtooth at L10.
      - name: Calibration (report only) — train · misses G1 L5 (weak 0.73)
        continue-on-error: true
        run: node scripts/sim/calibrate.mjs train --n 1200 --no-write
      - name: Calibration (report only) — koi · misses G1 L5 (weak 0.77)
        continue-on-error: true
        run: node scripts/sim/calibrate.mjs koi --n 2000 --no-write
      - name: Calibration (report only) — mem · misses B L4 (median 0.93 vs 0.87), G1 L5 (weak 0.73)
        continue-on-error: true
        run: node scripts/sim/calibrate.mjs mem --n 1200 --no-write
      - name: Calibration (report only) — rain · misses B L1-6/11/16/21/26, G3 L11/16/21/26 (breathers keep G4)
        continue-on-error: true
        run: node scripts/sim/calibrate.mjs rain --n 1200 --no-write
      - name: Calibration (report only) — word · misses B on 49/49 (median 7-22 points above p*)
        continue-on-error: true
        run: node scripts/sim/calibrate.mjs word --n 1200 --no-write
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (5 games + 320px)
        run: npm test
