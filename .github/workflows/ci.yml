name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browsers for ubuntu 26.04 (ubuntu-latest since 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parity with the artifact export
        run: npm run parity
      - name: Difficulty engine tests
        run: npm run test:sim
      - name: Install platform detection tests
        run: npm run test:install
      # Calibration gates (seeded, full N = 1200 per MERGED-SPEC §6; koi 2000). Only koi passes at full N.
      # mem (G2/G3 at legacy L6-L8), train, rain and word miss gates in legacy levels; Duy lifted the
      # legacy freeze (E3, 2026-11-21) and the retune lands in the next PR. Until then they report
      # without blocking. Drop continue-on-error per game once it goes green.
      - name: Calibration gates (blocking) — koi
        run: node scripts/sim/calibrate.mjs koi --n 2000 --no-write
      - name: Calibration gates (report only) — mem, train, rain, word
        continue-on-error: true
        run: |
          rc=0
          node scripts/sim/calibrate.mjs mem --n 1200 --no-write || rc=1
          node scripts/sim/calibrate.mjs train --n 1200 --no-write || rc=1
          node scripts/sim/calibrate.mjs rain --n 1200 --no-write || rc=1
          node scripts/sim/calibrate.mjs word --n 1200 --no-write || rc=1
          exit $rc
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (5 games + 320px)
        run: npm test
