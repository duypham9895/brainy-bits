name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browsers for ubuntu 26.04 (ubuntu-latest since 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parity with the artifact export
        run: npm run parity
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (5 games + 320px)
        run: npm test
