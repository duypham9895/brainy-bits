name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browsers for ubuntu 26.04 (ubuntu-latest since 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parity with the artifact export
        run: npm run parity
      - name: Difficulty engine tests
        run: npm run test:sim
      # Calibration gates (seeded, < 2 min total, so full N). mem and koi pass and block.
      # train, rain and word still miss gates that wait on Duy's answers in
      # gates/01-spec/DIFFICULTY-DECISIONS.md, so they report without blocking. Drop
      # continue-on-error once a game goes green.
      - name: Calibration gates (blocking) — mem, koi
        run: |
          node scripts/sim/calibrate.mjs mem --no-write
          node scripts/sim/calibrate.mjs koi --n 2000 --no-write
      - name: Calibration gates (report only) — train, rain, word
        continue-on-error: true
        run: |
          rc=0
          node scripts/sim/calibrate.mjs train --n 1200 --no-write || rc=1
          node scripts/sim/calibrate.mjs rain --no-write || rc=1
          node scripts/sim/calibrate.mjs word --no-write || rc=1
          exit $rc
      - run: npx playwright install --with-deps chromium
      - name: Smoke test (5 games + 320px)
        run: npm test
